<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JimNote – Flashcards</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Tailwind: enable class-based dark mode, add our font + accent colors
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'] },
      colors: { brand: { DEFAULT: '#0f766e', light: '#2dd4bf' } }
    } }
  };
  // Apply saved theme BEFORE first paint to avoid a flash
  (function () {
    try {
      const t = localStorage.getItem('deckly:theme');
      const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
</script>
<style>
  /* 3D flip card */
  .scene { perspective: 1200px; }
  .card { transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,.2,.2,1); }
  .card.flipped { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .back { transform: rotateY(180deg); }
  @keyframes inNext { from { opacity: 0; transform: translateX(48px); } to { opacity: 1; transform: none; } }
  @keyframes inPrev { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: none; } }
  .slide-next { animation: inNext .3s ease-out; }
  .slide-prev { animation: inPrev .3s ease-out; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .slide-next, .slide-prev { animation: none; } }
</style>
</head>
<body class="font-sans bg-[#f2f6f4] text-[#14231e] dark:bg-[#0d1512] dark:text-[#e6f0ec] min-h-screen transition-colors">

<header class="sticky top-0 z-10 backdrop-blur bg-[#f2f6f4]/85 dark:bg-[#0d1512]/85 border-b border-black/10 dark:border-white/10">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <button id="home" class="flex items-center gap-2 text-xl font-bold tracking-tight hover:text-brand dark:hover:text-brand-light transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>
      JimNote
    </button>
    <div class="flex items-center gap-1">
    <button id="syncbtn" aria-label="Sync with GitHub" title="Sync with GitHub" class="flex items-center gap-1.5 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg>
      <span class="hidden sm:inline text-sm font-medium">Sync</span>
    </button>
    <button id="theme" aria-label="Toggle dark mode" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
      <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    </div>
  </div>
</header>

<main id="app" class="max-w-4xl mx-auto px-4 py-8"></main>

<script>
/* =====================================================================
   DATA PERSISTENCE (localStorage)
   ---------------------------------------------------------------------
   localStorage stores only STRINGS, per browser and per site. So:
     • SAVE: convert our decks array to a JSON string -> setItem(key, str)
     • LOAD: getItem(key) -> JSON.parse back into an array
   We call saveDecks() after every change (create, edit, delete), so data
   is always up to date and survives page refreshes and browser restarts.
   Everything is wrapped in try/catch because localStorage can throw
   (private browsing, storage full, blocked by settings). If it fails,
   the app keeps working in memory for the session.
   ===================================================================== */
// NOTE: storage keys keep the old 'deckly:' prefix so decks saved before the
// rename to JimNote still load. Don't change them or existing data is hidden.
const KEY = 'deckly:decks';

function loadDecks() {
  try {
    const raw = localStorage.getItem(KEY);      // null if nothing saved yet
    return raw ? JSON.parse(raw) : [];          // string -> array
  } catch (e) {
    console.warn('Could not read saved decks:', e);
    return [];
  }
}

function saveDecks() {
  scheduleSync();
  try {
    localStorage.setItem(KEY, JSON.stringify(decks)); // array -> string
  } catch (e) {
    alert('Could not save: browser storage is full or disabled.');
  }
}

/* ---------- App state ---------- */
let decks = loadDecks();     // each deck: {id, title, cards, folderId, modified}

/* Folders live under their own localStorage key. A deck points to its folder
   through deck.folderId (null = not in a folder), so moving a deck is just
   changing that one field and saving. deck.modified is a timestamp (ms)
   refreshed on every save; it powers the "Date modified" sort. */
const FKEY = 'deckly:folders';
function loadFolders() {
  try { return JSON.parse(localStorage.getItem(FKEY)) || []; } catch (e) { return []; }
}
function saveFolders() {
  scheduleSync();
  try { localStorage.setItem(FKEY, JSON.stringify(folders)); }
  catch (e) { alert('Could not save: browser storage is full or disabled.'); }
}
let folders = loadFolders(); // each folder: {id, name, created}
let currentFolder = null;    // folder id being viewed (null = top level)
// The chosen sort order is remembered too ('modified' or 'az')
let sort = (() => { try { return localStorage.getItem('deckly:sort') || 'modified'; } catch (e) { return 'modified'; } })();
let view = 'dashboard';     // 'dashboard' | 'editor' | 'study'
let editingId = null;       // deck being edited (null = new deck)
let studyDeck = null;       // deck being studied
let idx = 0;                // current card index

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* Reusable styles */
const btnPrimary = 'inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-brand text-white font-medium hover:bg-teal-800 active:scale-[.98] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-light';
const btnGhost = 'inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-black/15 dark:border-white/15 font-medium hover:bg-black/5 dark:hover:bg-white/10 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-light';
const input = 'w-full px-3 py-2.5 rounded-lg bg-white dark:bg-[#16211d] border border-black/15 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-brand/60 placeholder:text-black/35 dark:placeholder:text-white/30';
const icon = {
  plus: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trash: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  edit: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  left: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  play: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  shuffle: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
};

/* ---------- GitHub gist sync ----------
   Optional. You paste a GitHub token once; the app then keeps all decks and
   folders in ONE private gist (file jimnote-data.json) on your account.
   On load, on every save, and when you return to the tab it:
     1. downloads the gist and MERGES it with local data (per deck/folder,
        whichever was modified last wins),
     2. uploads the merged result.
   Deletions are remembered as "tombstones" (id + time) so a deleted deck is
   not resurrected by another device. The token lives only in this browser's
   localStorage; it is never part of this file. */
const SKEY = 'deckly:sync', TKEY = 'deckly:tomb', SYNC_FILE = 'jimnote-data.json';
let tomb = (() => { try { const t = JSON.parse(localStorage.getItem(TKEY)); return { d: (t && t.d) || {}, f: (t && t.f) || {} }; } catch (e) { return { d: {}, f: {} }; } })();
const saveTomb = () => { try { localStorage.setItem(TKEY, JSON.stringify(tomb)); } catch (e) {} };
const getSync = () => { try { const c = JSON.parse(localStorage.getItem(SKEY)); return c && c.token ? c : null; } catch (e) { return null; } };
const setSync = c => { try { c ? localStorage.setItem(SKEY, JSON.stringify(c)) : localStorage.removeItem(SKEY); } catch (e) {} };
let syncing = false, syncTimer = null, syncMsg = '';

function setMsg(m) { syncMsg = m; const el = document.getElementById('sync-msg'); if (el) el.textContent = m; }
function scheduleSync() {                       // called after every local save (debounced)
  if (syncing || !getSync()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500);
}

async function gh(path, opts = {}) {
  const res = await fetch('https://api.github.com' + path, { ...opts, headers: {
    Authorization: 'Bearer ' + getSync().token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' } });
  if (res.status === 401) throw new Error('GitHub rejected the token. Create a new classic token with the "gist" permission.');
  if (res.status === 404) throw new Error('Gist not found. Check the gist ID, and that the token is from the same GitHub account.');
  if (!res.ok) throw new Error('GitHub error ' + res.status);
  return res.json();
}

// Rebuild records from known fields only, so a bad file can't inject junk
function cleanData(data) {
  const isCard = c => c && typeof c.term === 'string' && typeof c.definition === 'string';
  return {
    decks: (data.decks || []).filter(d => d && typeof d.title === 'string' && Array.isArray(d.cards)).map(d => ({
      id: String(d.id || uid()), title: d.title, folderId: d.folderId || null, modified: +d.modified || 0,
      cards: d.cards.filter(isCard).map(c => ({ term: c.term, definition: c.definition })) })),
    folders: (data.folders || []).filter(f => f && typeof f.name === 'string').map(f => ({
      id: String(f.id || uid()), name: f.name, created: +f.created || 0, modified: +f.modified || 0 }))
  };
}
const itemTime = x => x.modified || x.created || 0;
function mergeList(local, remote, key) {
  const map = new Map(local.map(x => [x.id, x]));
  remote.forEach(x => { const l = map.get(x.id); if (!l || itemTime(x) > itemTime(l)) map.set(x.id, x); });
  return [...map.values()].filter(x => { const t = tomb[key][x.id]; return t === undefined || itemTime(x) > t; });
}

async function syncNow() {
  const cfg = getSync();
  if (!cfg || syncing) return;
  syncing = true; setMsg('Syncing…');
  try {
    let remoteText = null;
    if (cfg.gistId) {
      const g = await gh('/gists/' + cfg.gistId);
      const f = g.files && g.files[SYNC_FILE];
      if (f) {
        remoteText = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
        const r = JSON.parse(remoteText), rc = cleanData(r), rt = r.tomb || {};
        ['d', 'f'].forEach(k => Object.entries(rt[k] || {}).forEach(([id, t]) => { tomb[k][id] = Math.max(tomb[k][id] || 0, +t || 0); }));
        decks = mergeList(decks, rc.decks, 'd'); folders = mergeList(folders, rc.folders, 'f');
        decks.forEach(d => { if (d.folderId && !folders.some(x => x.id === d.folderId)) d.folderId = null; });
        saveDecks(); saveFolders(); saveTomb();
      }
    }
    const content = JSON.stringify({ app: 'JimNote', decks, folders, tomb });
    if (content !== remoteText) {
      const body = JSON.stringify({ description: 'JimNote data', public: false, files: { [SYNC_FILE]: { content } } });
      if (cfg.gistId) await gh('/gists/' + cfg.gistId, { method: 'PATCH', body });
      else cfg.gistId = (await gh('/gists', { method: 'POST', body })).id;   // first sync creates a private gist
    }
    cfg.last = Date.now(); setSync(cfg);
    setMsg('Synced at ' + new Date(cfg.last).toLocaleTimeString());
    const gi = document.getElementById('sync-gist'); if (gi) gi.value = cfg.gistId;
    if (view === 'dashboard') render();   // never re-render while editing a form
  } catch (e) { setMsg(e.message || 'Sync failed'); }
  finally { syncing = false; }
}

function openSync() {
  const cfg = getSync() || {};
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center sm:p-4';
  wrap.innerHTML = `
    <div role="dialog" aria-modal="true" aria-label="Sync with GitHub" class="w-full sm:max-w-lg max-h-[92vh] overflow-auto rounded-t-2xl sm:rounded-2xl bg-[#f2f6f4] dark:bg-[#0d1512] border border-black/10 dark:border-white/10 p-5 shadow-2xl">
      <div class="flex items-start justify-between gap-4 mb-2">
        <h2 class="text-xl font-bold">Sync with GitHub</h2>
        <button id="sy-close" aria-label="Close" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="text-sm opacity-70 mb-4">Saves your decks to a private gist on your GitHub account so every device stays in step.</p>
      <label class="block text-sm font-medium mb-1" for="sync-token">Personal access token (classic, “gist” permission)</label>
      <input id="sync-token" type="password" autocomplete="off" class="${input}" placeholder="ghp_…" value="${esc(cfg.token || '')}">
      <a href="https://github.com/settings/tokens/new?description=JimNote&scopes=gist" target="_blank" rel="noopener" class="text-sm underline hover:text-brand dark:hover:text-brand-light">Create a token on GitHub</a>
      <label class="block text-sm font-medium mt-4 mb-1" for="sync-gist">Gist ID</label>
      <input id="sync-gist" autocomplete="off" class="${input}" placeholder="Leave blank on your first device" value="${esc(cfg.gistId || '')}">
      <p class="text-xs opacity-60 mt-1">On your other devices, paste the same token and this gist ID.</p>
      <p id="sync-msg" class="text-sm font-medium mt-4 min-h-[1.25rem]">${esc(syncMsg)}</p>
      <div class="flex flex-wrap justify-end gap-3 mt-4">
        ${cfg.token ? `<button id="sy-off" class="${btnGhost}">Disconnect</button>` : ''}
        <button id="sy-go" class="${btnPrimary}">Save &amp; sync now</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $ = sel => wrap.querySelector(sel);
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $('#sy-close').onclick = close;
  $('#sy-go').onclick = () => {
    const token = $('#sync-token').value.trim();
    if (!token) return setMsg('Paste your GitHub token first.');
    const gistId = $('#sync-gist').value.trim().split('/').pop();   // also accepts a full gist URL
    setSync({ token, gistId, last: cfg.last });
    cfg.token = token;
    syncNow();
  };
  const off = $('#sy-off');
  if (off) off.onclick = () => { setSync(null); setMsg('Disconnected. Your decks stay on this device.'); close(); };
}

/* ---------- Router ---------- */
function render() {
  ({ dashboard: renderDashboard, editor: renderEditor, study: renderStudy, quiz: renderQuiz })[view]();
  window.scrollTo(0, 0);
}
function go(v) { view = v; render(); }

/* ---------- Dashboard ---------- */
icon.folder = '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

// Sort a list either A-Z by a name field, or newest-first by a timestamp field
function sortItems(list, nameKey, dateKey) {
  return [...list].sort(sort === 'az'
    ? (x, y) => x[nameKey].localeCompare(y[nameKey], undefined, { sensitivity: 'base' })
    : (x, y) => (y[dateKey] || 0) - (x[dateKey] || 0));
}
// A folder counts as modified when it was created or any deck inside it was saved
const folderModified = f => Math.max(f.created || 0, ...decks.filter(d => d.folderId === f.id).map(d => d.modified || 0));
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';

icon.download = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>';

/* ---------- Export as .txt ----------
   Single deck: one card per line, "term<TAB>definition" (the same layout
   Quizlet uses for import). Export all: same lines, grouped under
   folder and deck headings. */
const clean = t => String(t).replace(/\s+/g, ' ').trim();
const cardLines = d => d.cards.map(c => clean(c.term) + '\t' + clean(c.definition)).join('\n');

function downloadTxt(filename, text, type = 'text/plain') {
  const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeName = t => t.replace(/[\\/:*?"<>|]+/g, '').trim() || 'deck';

function exportDeck(d) { downloadTxt(safeName(d.title) + '.txt', cardLines(d) + '\n'); }

function exportAll() {
  const section = (label, list) => list.length
    ? `# ${label}\n\n` + list.map(d => `## ${d.title}\n${cardLines(d)}`).join('\n\n') : '';
  const parts = [
    ...folders.map(f => section(f.name, decks.filter(d => d.folderId === f.id))),
    section('No folder', decks.filter(d => !d.folderId))
  ].filter(Boolean);
  downloadTxt('jimnote-all-decks.txt', parts.join('\n\n\n') + '\n');
}

/* ---------- Backup & restore ----------
   Browsers wipe localStorage when you clear "cookies and site data", and a
   web page cannot prevent that. The fix is a copy OUTSIDE the browser:
   "Back up" saves all decks + folders to a .json file; "Restore" reads one
   back and MERGES it in (decks/folders already present are never duplicated
   or overwritten). */
const LBKEY = 'deckly:lastbackup';
const lastBackup = () => { try { return +localStorage.getItem(LBKEY) || 0; } catch (e) { return 0; } };

function backupAll() {
  const data = { app: 'JimNote', version: 1, exported: Date.now(), decks, folders };
  downloadTxt(`jimnote-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), 'application/json');
  try { localStorage.setItem(LBKEY, String(Date.now())); } catch (e) {}
  render();
}

function restoreFrom(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      const isCard = c => c && typeof c.term === 'string' && typeof c.definition === 'string';
      // Re-build every record from known fields only, so a bad file can't inject junk
      const inDecks = (data.decks || []).filter(d => d && typeof d.title === 'string' && Array.isArray(d.cards)).map(d => ({
        id: String(d.id || uid()), title: d.title, folderId: d.folderId || null, modified: +d.modified || 0,
        cards: d.cards.filter(isCard).map(c => ({ term: c.term, definition: c.definition }))
      }));
      const inFolders = (data.folders || []).filter(f => f && typeof f.name === 'string')
        .map(f => ({ id: String(f.id || uid()), name: f.name, created: +f.created || 0 }));
      const haveD = new Set(decks.map(d => d.id)), haveF = new Set(folders.map(f => f.id));
      const newD = inDecks.filter(d => !haveD.has(d.id)), newF = inFolders.filter(f => !haveF.has(f.id));
      decks = [...decks, ...newD]; folders = [...folders, ...newF];
      decks.forEach(d => { if (d.folderId && !folders.some(f => f.id === d.folderId)) d.folderId = null; });
      saveDecks(); saveFolders();
      alert(`Restored ${newD.length} deck${newD.length === 1 ? '' : 's'} and ${newF.length} folder${newF.length === 1 ? '' : 's'}.`);
      render();
    } catch (e) { alert('That file could not be read. Choose a .json backup made by JimNote.'); }
  };
  rd.readAsText(file);
}

function deckCard(d) {
  return `<article class="rounded-2xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10 p-5 hover:border-brand dark:hover:border-brand-light hover:-translate-y-0.5 transition">
    <h3 class="text-lg font-bold truncate">${esc(d.title)}</h3>
    <p class="text-sm opacity-60 mt-1">${d.cards.length} card${d.cards.length === 1 ? '' : 's'}${d.modified ? ' · edited ' + fmtDate(d.modified) : ''}</p>
    <div class="mt-5 flex flex-wrap items-center gap-2">
      <button data-study="${d.id}" class="${btnPrimary} !py-2">${icon.play} Study</button>
      <button data-quiz="${d.id}" class="${btnGhost} !py-2">Quiz</button>
      <button data-edit="${d.id}" aria-label="Edit deck" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition">${icon.edit}</button>
      <button data-export="${d.id}" aria-label="Export deck as text file" title="Export as .txt" class="p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition">${icon.download}</button>
      <button data-del="${d.id}" aria-label="Delete deck" class="p-2 rounded-lg hover:bg-red-500/10 hover:text-red-600 dark:hover:text-red-400 transition ml-auto">${icon.trash}</button>
    </div>
  </article>`;
}

function folderCard(f) {
  const n = decks.filter(d => d.folderId === f.id).length;
  return `<div data-open="${f.id}" tabindex="0" role="link" class="cursor-pointer rounded-2xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10 p-4 flex items-center gap-3 hover:border-brand dark:hover:border-brand-light hover:-translate-y-0.5 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-light">
    <span class="text-brand dark:text-brand-light">${icon.folder}</span>
    <div class="min-w-0 flex-1">

        <p class="text-lg font-medium">${folder ? 'This folder is empty' : 'No decks yet'}</p>

  const q = sel => $app.querySelectorAll(sel);
  q('[data-up]').forEach(b => b.onclick = () => { currentFolder = null; render(); });
  document.getElementById('sort').onchange = e => {
    sort = e.target.value;
    try { localStorage.setItem('deckly:sort', sort); } catch (err) {}
    render();

  q('[data-newfolder]').forEach(b => b.onclick = () => {
    const name = (prompt('Folder name') || '').trim();
    if (!name) return;
    folders.push({ id: uid(), name, created: Date.now(), modified: Date.now() });
    saveFolders();
    render();
  });
  q('[data-open]').forEach(el => {
    const open = e => { if (e.target.closest('button')) return; currentFolder = el.dataset.open; render(); };

    el.onkeydown = e => { if (e.key === 'Enter') open(e); };

  q('[data-rename]').forEach(b => b.onclick = () => {
    const f = folders.find(x => x.id === b.dataset.rename);
    const name = (prompt('Rename folder', f.name) || '').trim();
    if (!name) return;
    f.name = name; f.modified = Date.now();
    saveFolders();
    render();
  });
  q('[data-delfolder]').forEach(b => b.onclick = () => {
    const f = folders.find(x => x.id === b.dataset.delfolder);
    if (!confirm(`Delete folder "${f.name}"? Its decks will be kept and moved to your main list.`)) return;
    decks.forEach(d => { if (d.folderId === f.id) { d.folderId = null; d.modified = Date.now(); } });
    folders = folders.filter(x => x.id !== f.id);
    tomb.f[f.id] = Date.now(); saveTomb();   // remember the deletion so sync doesn't bring it back
    saveDecks(); saveFolders();
    render();
  });
  q('[data-quiz]').forEach(b => b.onclick = () => startQuiz(decks.find(d => d.id === b.dataset.quiz)));
  q('[data-export]').forEach(b => b.onclick = () => exportDeck(decks.find(d => d.id === b.dataset.export)));
  const rf = document.getElementById('restorefile');
  q('[data-restore]').forEach(b => b.onclick = () => rf.click());
  rf.onchange = () => { if (rf.files[0]) restoreFrom(rf.files[0]); };
  const bk = document.getElementById('backup');
  if (bk) bk.onclick = backupAll;
  const ea = document.getElementById('exportall');
  if (ea) ea.onclick = exportAll;
  q('[data-new]').forEach(b => b.onclick = () => { editingId = null; go('editor'); });
  q('[data-edit]').forEach(b => b.onclick = () => { editingId = b.dataset.edit; go('editor'); });
  q('[data-study]').forEach(b => b.onclick = () => {
    studyDeck = decks.find(d => d.id === b.dataset.study);
    if (!studyDeck.cards.length) return alert('This deck has no cards yet. Edit it to add some.');
    idx = 0; go('study');
  });
  q('[data-del]').forEach(b => b.onclick = () => {
    const d = decks.find(x => x.id === b.dataset.del);
    if (confirm(`Delete "${d.title}"? This can't be undone.`)) {
      decks = decks.filter(x => x.id !== d.id);
      tomb.d[d.id] = Date.now(); saveTomb();   // remember the deletion so sync doesn't bring it back
      saveDecks();            // persist the deletion
      render();
    }
  });
}

/* ---------- Bulk import modal ----------
   Paste text, choose the separators, see a live preview, then add all the
   parsed cards to the editor at once. Each card is split at the FIRST
   term/definition separator, so definitions may safely contain commas. */
icon.upload = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>';

function parseImport(text, td, cd) {
  if (!td || !cd) return [];
  const pieces = cd === '\n' ? text.split(/\r?\n/) : text.split(cd);
  return pieces.map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(td);
    return i < 0 ? null : { term: l.slice(0, i).trim(), definition: l.slice(i + td.length).trim() };
  }).filter(c => c && c.term && c.definition);
}

function openImport(onDone) {
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center sm:p-4';
  const radio = (name, val, label, on) => `<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="radio" name="${name}" value="${val}" ${on ? 'checked' : ''} class="accent-teal-700 w-4 h-4"> ${label}</label>`;
  const custom = (name, id) => `<label class="flex items-center gap-2 py-1.5 cursor-pointer"><input type="radio" name="${name}" value="custom" class="accent-teal-700 w-4 h-4"><input id="${id}" placeholder="Custom" class="${input} !py-1.5 !w-36"></label>`;
  wrap.innerHTML = `
    <div role="dialog" aria-modal="true" aria-label="Import cards" class="w-full sm:max-w-2xl max-h-[92vh] overflow-auto rounded-t-2xl sm:rounded-2xl bg-[#f2f6f4] dark:bg-[#0d1512] border border-black/10 dark:border-white/10 p-5 shadow-2xl">
      <div class="flex items-start justify-between gap-4 mb-3">
        <p><strong>Import your data.</strong> <span class="opacity-70">Paste from Word, Excel, Google Docs, or a JimNote .txt export.</span></p>
        <button id="imp-close" aria-label="Close" class="p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <textarea id="imp-text" rows="7" class="${input} font-mono text-sm" placeholder="Word 1&#9;Definition 1&#10;Word 2&#9;Definition 2&#10;Word 3&#9;Definition 3"></textarea>
      <div class="grid sm:grid-cols-2 gap-4 mt-4">
        <fieldset><legend class="font-bold mb-1">Between term and definition</legend>
          ${radio('td', 'tab', 'Tab', true)}${radio('td', 'comma', 'Comma')}${custom('td', 'td-custom')}</fieldset>
        <fieldset><legend class="font-bold mb-1">Between cards</legend>
          ${radio('cd', 'nl', 'New line', true)}${radio('cd', 'semi', 'Semicolon')}${custom('cd', 'cd-custom')}</fieldset>
      </div>
      <h3 class="text-lg font-bold mt-5">Preview <span id="imp-count" class="text-sm font-normal opacity-60"></span></h3>
      <div id="imp-preview" class="mt-2 space-y-1.5 text-sm"></div>
      <div class="flex justify-end gap-3 mt-5">
        <button id="imp-cancel" class="${btnGhost}">Cancel</button>
        <button id="imp-go" class="${btnPrimary} disabled:opacity-40 disabled:pointer-events-none">Import cards</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $ = sel => wrap.querySelector(sel);

  const delims = () => {
    const pick = n => wrap.querySelector(`input[name=${n}]:checked`).value;
    const td = pick('td'), cd = pick('cd');
    return [td === 'custom' ? $('#td-custom').value : { tab: '\t', comma: ',' }[td],
            cd === 'custom' ? $('#cd-custom').value : { nl: '\n', semi: ';' }[cd]];
  };
  let parsed = [];
  const update = () => {
    parsed = parseImport($('#imp-text').value, ...delims());
    $('#imp-count').textContent = parsed.length + ' card' + (parsed.length === 1 ? '' : 's');
    $('#imp-go').disabled = !parsed.length;
    $('#imp-preview').innerHTML = parsed.length
      ? parsed.slice(0, 8).map(c => `<div class="grid grid-cols-2 gap-3 p-2 rounded-lg bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10"><span class="truncate">${esc(c.term)}</span><span class="truncate opacity-70">${esc(c.definition)}</span></div>`).join('')
        + (parsed.length > 8 ? `<p class="opacity-60 pt-1">and ${parsed.length - 8} more</p>` : '')
      : '<p class="opacity-60">Nothing to preview yet.</p>';
  };
  // Typing in a "Custom" box selects its radio button automatically
  ['td', 'cd'].forEach(n => $(`#${n}-custom`).addEventListener('focus', () => { wrap.querySelector(`input[name=${n}][value=custom]`).checked = true; update(); }));
  wrap.addEventListener('input', update);
  wrap.addEventListener('change', update);

  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $('#imp-close').onclick = $('#imp-cancel').onclick = close;
  $('#imp-go').onclick = () => { onDone(parsed); close(); };
  update();
  $('#imp-text').focus();
}

/* ---------- Deck editor ---------- */
function rowHTML(t = '', df = '') {
  return `<div class="row grid grid-cols-[1fr_auto] gap-2 p-3 rounded-xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10">
    <div class="grid sm:grid-cols-2 gap-2">
      <input class="${input} term" placeholder="Term" value="${esc(t)}">
      <input class="${input} def" placeholder="Definition" value="${esc(df)}">
    </div>
    <button type="button" class="rm p-2 self-center rounded-lg hover:bg-red-500/10 hover:text-red-600 dark:hover:text-red-400 transition" aria-label="Remove row">${icon.trash}</button>
  </div>`;
}

function renderEditor() {
  const deck = decks.find(d => d.id === editingId);
  const cards = deck ? deck.cards : [{ term: '', definition: '' }, { term: '', definition: '' }, { term: '', definition: '' }];
  $app.innerHTML = `
    <h1 class="text-3xl font-bold tracking-tight mb-6">${deck ? 'Edit deck' : 'New deck'}</h1>
    <label class="block text-sm font-medium mb-1" for="title">Title or subject</label>
    <input id="title" class="${input} text-lg mb-4" placeholder="e.g. Spanish – Food vocabulary" value="${deck ? esc(deck.title) : ''}">
    <label class="block text-sm font-medium mb-1" for="folder">Folder</label>
    <select id="folder" class="${input} mb-8">
      <option value="">No folder</option>
      ${folders.map(f => `<option value="${f.id}" ${(deck ? deck.folderId : currentFolder) === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}
    </select>
    <div id="rows" class="space-y-3"></div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <button id="add" type="button" class="${btnGhost} justify-center">${icon.plus} Add card</button>
      <button id="import" type="button" class="${btnGhost} justify-center">${icon.upload} Import cards</button>
    </div>
    <div class="flex gap-3 mt-8 justify-end">
      <button id="cancel" class="${btnGhost}">Cancel</button>
      <button id="save" class="${btnPrimary}">Save deck</button>
    </div>`;

  const rows = document.getElementById('rows');
  const addRow = (t, d) => rows.insertAdjacentHTML('beforeend', rowHTML(t, d));
  cards.forEach(c => addRow(c.term, c.definition));

  // Event delegation: one listener handles every row's remove button
  rows.onclick = e => {
    const rm = e.target.closest('.rm');
    if (rm) rm.closest('.row').remove();
  };
  document.getElementById('add').onclick = () => {
    addRow();
    rows.lastElementChild.querySelector('.term').focus();
  };
  document.getElementById('import').onclick = () => openImport(imported => {
    // Drop untouched empty rows, then append every imported card as a new row
    rows.querySelectorAll('.row').forEach(r => {
      if (!r.querySelector('.term').value.trim() && !r.querySelector('.def').value.trim()) r.remove();
    });
    imported.forEach(c => addRow(c.term, c.definition));
  });
  document.getElementById('cancel').onclick = () => go('dashboard');
  document.getElementById('save').onclick = () => {
    const title = document.getElementById('title').value.trim();
    // Read every row from the DOM, keep only rows where both fields are filled
    const newCards = [...rows.querySelectorAll('.row')].map(r => ({
      term: r.querySelector('.term').value.trim(),
      definition: r.querySelector('.def').value.trim()
    })).filter(c => c.term && c.definition);

    if (!title) return alert('Please give your deck a title.');
    if (!newCards.length) return alert('Add at least one card with both a term and a definition.');

    const folderId = document.getElementById('folder').value || null;
    const modified = Date.now();                                        // used by "Date modified" sort
    const live = decks.find(d => d.id === editingId);
    if (live) Object.assign(live, { title, cards: newCards, folderId, modified }); // update existing
    else decks.unshift({ id: uid(), title, cards: newCards, folderId, modified }); // add new
    saveDecks();   // write the whole decks array to localStorage
    go('dashboard');
  };
  document.getElementById('title').focus();
}

/* ---------- Shared helpers for study + quiz ---------- */
icon.search = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';

// Unbiased Fisher-Yates shuffle (returns a copy)
function shuffleArr(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

/* "Show first" setting: which side of a card you see first ('term' or 'def').
   Saved in localStorage and used by both flashcards and quizzes. */
let first = (() => { try { return localStorage.getItem('deckly:first') || 'term'; } catch (e) { return 'term'; } })();
const frontOf = c => first === 'term' ? c.term : c.definition;
const backOf = c => first === 'term' ? c.definition : c.term;
const sideName = side => side === 'term' ? 'Term' : 'Definition';

const firstToggle = () => `<div role="group" aria-label="Show first" class="inline-flex rounded-lg border border-black/15 dark:border-white/15 p-0.5">
  ${['term', 'def'].map(v => `<button data-first="${v}" class="px-3 py-1.5 rounded-md text-sm font-medium transition ${first === v ? 'bg-brand text-white' : 'hover:bg-black/5 dark:hover:bg-white/10'}">${sideName(v)}</button>`).join('')}
</div>`;
function bindFirstToggle(root) {
  root.querySelectorAll('[data-first]').forEach(b => b.onclick = () => {
    first = b.dataset.first;
    try { localStorage.setItem('deckly:first', first); } catch (e) {}
    render();
  });
}

/* "When I get one wrong" setting for quizzes: 'retry' = try again without
   seeing the answer, 'show' = reveal the answer immediately. Saved too. */
let wrongMode = (() => { try { return localStorage.getItem('deckly:wrongmode') || 'retry'; } catch (e) { return 'retry'; } })();
const wrongToggle = () => `<div role="group" aria-label="When I get one wrong" class="inline-flex rounded-lg border border-black/15 dark:border-white/15 p-0.5">
  ${[['retry', 'Let me retry'], ['show', 'Show the answer']].map(([v, l]) => `<button data-wm="${v}" class="px-3 py-1.5 rounded-md text-sm font-medium transition ${wrongMode === v ? 'bg-brand text-white' : 'hover:bg-black/5 dark:hover:bg-white/10'}">${l}</button>`).join('')}
</div>`;
function bindWrongToggle(root) {
  root.querySelectorAll('[data-wm]').forEach(b => b.onclick = () => {
    wrongMode = b.dataset.wm;
    try { localStorage.setItem('deckly:wrongmode', wrongMode); } catch (e) {}
    render();
  });
}

/* ---------- Study mode ---------- */
function renderStudy() {
  const total = studyDeck.cards.length;
  $app.innerHTML = `
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
        <button id="back" class="${btnGhost} !py-2">${icon.left} Decks</button>
        <div class="flex gap-2">
          <button id="shuffle" class="${btnGhost} !py-2">${icon.shuffle} Shuffle</button>
          <button id="quiz" class="${btnGhost} !py-2">Quiz</button>
        </div>
      </div>
      <h1 class="text-xl font-bold truncate">${esc(studyDeck.title)}</h1>
      <div class="h-1.5 rounded-full bg-black/10 dark:bg-white/10 my-3 overflow-hidden">
        <div id="bar" class="h-full bg-brand dark:bg-brand-light transition-all duration-300"></div>
      </div>
      <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
        <p id="count" class="text-sm opacity-60"></p>
        <div class="flex items-center gap-2 text-sm"><span class="opacity-60">Show first</span>${firstToggle()}</div>
      </div>

      <div id="slide">
        <div class="scene">
          <div id="card" role="button" tabindex="0" aria-label="Flip card" class="card relative h-72 sm:h-80 cursor-pointer select-none">
            <div class="face absolute inset-0 rounded-3xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10 shadow-lg flex flex-col items-center justify-center p-8 text-center">
              <span id="front-label" class="text-sm opacity-50 mb-3"></span>
              <p id="front" class="text-2xl sm:text-3xl font-bold break-words max-w-full overflow-auto"></p>
            </div>
            <div class="face back absolute inset-0 rounded-3xl bg-brand text-white shadow-lg flex flex-col items-center justify-center p-8 text-center">
              <span id="back-label" class="text-sm opacity-70 mb-3"></span>
              <p id="back-text" class="text-xl sm:text-2xl font-medium break-words max-w-full overflow-auto"></p>
            </div>
          </div>
        </div>
      </div>
      <p class="text-center text-sm opacity-50 mt-4">Click the card or press Space to flip. Use ← → to navigate.</p>

      <div class="flex justify-center gap-3 mt-6">
        <button id="prev" class="${btnGhost}">${icon.left} Previous</button>
        <button id="next" class="${btnPrimary}">Next ${icon.right}</button>
      </div>
      <div class="flex justify-center mt-3">
        <button id="google" class="${btnGhost} !py-2">${icon.search} Search Google</button>
      </div>
    </div>`;

  const $ = id => document.getElementById(id);
  const card = $('card'), slide = $('slide');
  const show = dir => {
    const c = studyDeck.cards[idx];
    // Reset the flip instantly (no animation) so the next answer never flashes mid-turn
    card.style.transition = 'none'; card.classList.remove('flipped'); void card.offsetWidth; card.style.transition = '';
    $('front').textContent = frontOf(c);
    $('back-text').textContent = backOf(c);
    $('front-label').textContent = sideName(first);
    $('back-label').textContent = sideName(first === 'term' ? 'def' : 'term');
    $('count').textContent = `Card ${idx + 1} of ${total}`;
    $('bar').style.width = ((idx + 1) / total * 100) + '%';
    ['prev', 'next'].forEach(id => {
      const off = id === 'prev' ? idx === 0 : idx === total - 1;
      $(id).disabled = off; $(id).classList.toggle('opacity-40', off);
    });
    if (dir) {   // slide-in animation from the direction of travel
      slide.classList.remove('slide-next', 'slide-prev'); void slide.offsetWidth;
      slide.classList.add(dir > 0 ? 'slide-next' : 'slide-prev');
    }
  };
  const move = n => { const j = idx + n; if (j >= 0 && j < total) { idx = j; show(n); } };

  card.onclick = () => card.classList.toggle('flipped');
  $('prev').onclick = () => move(-1);
  $('next').onclick = () => move(1);
  $('back').onclick = () => go('dashboard');
  $('quiz').onclick = () => startQuiz(studyDeck);
  $('shuffle').onclick = () => {
    // Shuffle a COPY so the saved order in localStorage is untouched
    studyDeck = { ...studyDeck, cards: shuffleArr(studyDeck.cards) };
    idx = 0; show(1);
  };
  $('google').onclick = () => {
    // Searches whichever side of the card you are currently looking at
    const c = studyDeck.cards[idx];
    const text = card.classList.contains('flipped') ? backOf(c) : frontOf(c);
    window.open('https://www.google.com/search?q=' + encodeURIComponent(text), '_blank', 'noopener');
  };
  bindFirstToggle($app);
  show();
}

/* ---------- Quiz (multiple choice) ----------
   Question count: 10, 20 or all terms. Each question shows one side of a
   card and offers up to 4 answers (the right one plus random wrong ones
   taken from the other cards in the deck). */
let quiz = null;
function startQuiz(deck) {
  if (deck.cards.length < 2) return alert('Add at least 2 cards to take a quiz.');
  quiz = { deck, stage: 'setup' };
  go('quiz');
}
function buildQuiz(deck, n) {
  return shuffleArr(deck.cards).slice(0, n).map(c => {
    const answer = backOf(c);
    const wrong = shuffleArr([...new Set(deck.cards.map(backOf))].filter(t => t !== answer)).slice(0, 3);
    return { prompt: frontOf(c), answer, options: shuffleArr([answer, ...wrong]) };
  });
}

function renderQuiz() {
  const q = quiz, total = q.deck.cards.length;
  const back = `<button data-qback class="${btnGhost} !py-2">${icon.left} Decks</button>`;
  const finish = () => $app.querySelectorAll('[data-qback]').forEach(b => b.onclick = () => go('dashboard'));

  if (q.stage === 'setup') {
    $app.innerHTML = `<div class="max-w-2xl mx-auto">
      <div class="mb-4">${back}</div>
      <h1 class="text-3xl font-bold tracking-tight break-words">Quiz: ${esc(q.deck.title)}</h1>
      <p class="opacity-60 mt-1 mb-6">Multiple choice · ${total} terms in this deck</p>
      <p class="font-medium mb-2">Each question shows the</p>${firstToggle()}
      <p class="font-medium mt-6 mb-2">When I get one wrong</p>${wrongToggle()}
      <p class="text-sm opacity-60 mt-2">Correct answers move on automatically.</p>
      <p class="font-medium mt-6 mb-2">How many terms?</p>
      <div class="grid sm:grid-cols-3 gap-3">
        ${[[10, '10 terms'], [20, '20 terms'], [total, `All terms (${total})`]].map(([n, l]) =>
          `<button data-n="${n}" ${n > total ? 'disabled' : ''} class="${btnGhost} justify-center !py-4 text-lg disabled:opacity-40 disabled:pointer-events-none">${l}</button>`).join('')}
      </div></div>`;
    bindFirstToggle($app);
    bindWrongToggle($app);
    $app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      const n = +b.dataset.n;
      Object.assign(quiz, { stage: 'q', n, qs: buildQuiz(q.deck, n), i: 0, score: 0, tried: [], done: false, wrong: [] });
      render();
    });
    return finish();
  }

  if (q.stage === 'q') {
    const cur = q.qs[q.i], last = q.i === q.qs.length - 1;
    const ok = q.done === 'correct', shown = q.done === 'revealed', over = ok || shown;
    const green = 'border-emerald-500 bg-emerald-500/15';
    const opt = (o, k) => {
      const tried = q.tried.includes(k);
      let cls = 'border-black/15 dark:border-white/15 bg-white dark:bg-[#16211d] hover:border-brand dark:hover:border-brand-light';
      if (tried) cls = 'border-red-500 bg-red-500/15 opacity-70';                       // an answer already tried
      else if (over) cls = o === cur.answer ? green : 'border-black/10 dark:border-white/10 opacity-60';
      return `<button data-opt="${k}" ${over || tried ? 'disabled' : ''} class="w-full text-left px-4 py-3.5 rounded-xl border-2 transition break-words ${cls}"><span class="opacity-50 mr-2">${k + 1}</span>${esc(o)}</button>`;
    };
    const nextBtn = `<button id="qnext" class="${btnPrimary}">${last ? 'See results' : 'Next'} ${icon.right}</button>`;
    const note = ok ? `<p class="font-medium text-emerald-600 dark:text-emerald-400">Correct!</p>${nextBtn}`
      : shown ? `<p class="font-medium">The right answer is highlighted.</p>${nextBtn}`
      : q.tried.length ? `<p class="font-medium">Not quite. Try again.</p><button id="reveal" class="${btnGhost} !py-2">Show answer</button>` : '';
    $app.innerHTML = `<div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-4">${back}<span class="text-sm opacity-70">Score ${q.score}</span></div>
      <div class="h-1.5 rounded-full bg-black/10 dark:bg-white/10 mb-3 overflow-hidden"><div class="h-full bg-brand dark:bg-brand-light transition-all duration-300" style="width:${(q.i + (over ? 1 : 0)) / q.qs.length * 100}%"></div></div>
      <p class="text-sm opacity-60 mb-3">Question ${q.i + 1} of ${q.qs.length}</p>
      <div class="rounded-2xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10 shadow p-6 sm:p-8 mb-5">
        <p class="text-sm opacity-50 mb-2">${sideName(first)}</p>
        <p class="text-2xl font-bold break-words">${esc(cur.prompt)}</p>
      </div>
      <div class="space-y-3">${cur.options.map(opt).join('')}</div>
      ${note ? `<div class="flex items-center justify-between gap-3 mt-5">${note}</div>` : ''}
    </div>`;

    const advance = () => {
      if (last) q.stage = 'done'; else { q.i++; q.tried = []; q.done = false; }
      render();
    };
    $app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
      const k = +b.dataset.opt;
      if (cur.options[k] === cur.answer) {
        if (!q.tried.length) q.score++;              // only a first-try answer earns a point
        q.done = 'correct';
        render();
        const at = q.i;                              // auto-advance shortly after a right answer
        setTimeout(() => { if (quiz === q && view === 'quiz' && q.stage === 'q' && q.i === at && q.done === 'correct') advance(); }, 900);
      } else {
        q.tried.push(k);
        if (q.tried.length === 1) q.wrong.push(cur); // first miss goes on the review list
        if (wrongMode === 'show') q.done = 'revealed'; // otherwise stay open so they can retry
        render();
      }
    });
    const rv = document.getElementById('reveal');
    if (rv) rv.onclick = () => { q.done = 'revealed'; render(); };
    const nx = document.getElementById('qnext');
    if (nx) nx.onclick = advance;
    return finish();
  }

  // Results
  const pct = Math.round(q.score / q.qs.length * 100);
  $app.innerHTML = `<div class="max-w-2xl mx-auto">
    <div class="mb-4">${back}</div>
    <div class="text-center rounded-2xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10 p-8">
      <p class="opacity-60">Quiz complete</p>
      <p class="text-6xl font-bold my-2 text-brand dark:text-brand-light">${pct}%</p>
      <p class="text-lg">${q.score} of ${q.qs.length} correct</p>
    </div>
    ${q.wrong.length ? `<h2 class="text-lg font-bold mt-6 mb-2">Review missed</h2>
      <div class="space-y-2">${q.wrong.map(w => `<div class="p-3 rounded-xl bg-white dark:bg-[#16211d] border border-black/10 dark:border-white/10"><p class="font-medium break-words">${esc(w.prompt)}</p><p class="text-sm text-emerald-700 dark:text-emerald-400 break-words">${esc(w.answer)}</p></div>`).join('')}</div>` : ''}
    <div class="flex flex-wrap gap-3 mt-6">
      ${q.wrong.length ? `<button id="retry" class="${btnPrimary}">Retry missed</button>` : ''}
      <button id="retake" class="${q.wrong.length ? btnGhost : btnPrimary}">New quiz</button>
      <button id="studydeck" class="${btnGhost}">Study deck</button>
    </div></div>`;
  const again = list => Object.assign(quiz, { stage: 'q', qs: list, i: 0, score: 0, tried: [], done: false, wrong: [] });
  const r = document.getElementById('retry');
  if (r) r.onclick = () => { again(shuffleArr(q.wrong).map(x => ({ ...x, options: shuffleArr(x.options) }))); render(); };
  document.getElementById('retake').onclick = () => { quiz.stage = 'setup'; render(); };
  document.getElementById('studydeck').onclick = () => { studyDeck = q.deck; idx = 0; go('study'); };
  finish();
}

/* Keyboard shortcuts (only active in study mode) */
document.addEventListener('keydown', e => {
  if (view === 'quiz' && quiz.stage === 'q' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    const k = parseInt(e.key, 10);                       // keys 1-4 pick an answer
    if (k >= 1 && k <= 4) document.querySelector(`[data-opt="${k - 1}"]`)?.click();
    else if (e.key === 'Enter' && !e.target.closest('button')) document.getElementById('qnext')?.click();
    return;
  }
  if (view !== 'study' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); document.getElementById('card').click(); }
});

/* Header controls */
document.getElementById('home').onclick = () => { currentFolder = null; go('dashboard'); };
document.getElementById('syncbtn').onclick = openSync;
document.getElementById('theme').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('deckly:theme', dark ? 'dark' : 'light'); } catch (e) {}
};

// Ask the browser not to evict our data when disk space runs low. This does NOT
// stop "Clear browsing data" from deleting it; use Back up for that.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

render();
if (getSync()) syncNow();                 // pull + push on page load
document.addEventListener('visibilitychange', () => {   // and when you come back to the tab
  const c = getSync();
  if (document.visibilityState === 'visible' && c && Date.now() - (c.last || 0) > 30000) syncNow();
});
</script>
</body>
</html>
